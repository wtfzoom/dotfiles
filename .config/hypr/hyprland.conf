# HYPRLAND CONFIG - DEEP BLOOD RED EDITION

# Monitor
monitor = HDMI-A-1, 1920x1080@200, 0x0, 1

# Programas
$terminal    = kitty
$fileManager = thunar
$menu        = wofi --show drun

# Autostart
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = waybar
exec-once = swaync
exec-once = swww-daemon && swww img ~/Imagens/wallpapers/guts2.png

# Variáveis de Ambiente
env = XCURSOR_SIZE, 20
env = HYPRCURSOR_SIZE, 20
env = XCURSOR_THEME, Rage-Cursor
env = HYPRCURSOR_THEME, Rage-Cursor 
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_QPA_PLATFORM, wayland;xcb
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = WLR_DRM_NO_MODIFIERS,1

# Aparência
general {
    gaps_in             = 5
    gaps_out            = 10
    border_size         = 1
    col.active_border   = rgba(660000cc)
    col.inactive_border = rgba(1a1a1a88)
    layout              = dwindle
}

decoration {
    rounding         = 10
    active_opacity   = 0.95
    inactive_opacity = 0.90
    shadow {
        enabled = false
    }
    blur {
        enabled           = true
        size              = 6
        passes            = 3
        vibrancy          = 0.1696
    }
}

animations {
    enabled = yes
    bezier = smoothOut, 0.16, 1, 0.3, 1
    bezier = linear, 0, 0, 1, 1
    animation = windows,     1, 4, smoothOut, slide
    animation = windowsIn,   1, 4, smoothOut, slide
    animation = windowsOut,  1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, smoothOut, slide
    animation = border,      1, 1, linear
    animation = fade,        1, 5, smoothOut
    animation = workspaces,  1, 5, smoothOut, slide
}

dwindle {
    pseudotile      = true
    preserve_split  = true
}

misc {
    vfr = true
    disable_hyprland_logo = true
}

# Teclado/Mouse
input {
    kb_layout    = br
    kb_variant   = abnt2
    kb_model     = abnt2
    follow_mouse = 1
    sensitivity  = 0
}

# Bindings
$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, $menu
bind = $mainMod, R, exec, wofi --show run
bind = $mainMod, C, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, M, exec, hyprctl dispatch exit

# Screenshots
bind = , Print, exec, grim - | wl-copy
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# Foco e Workspaces
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Audio
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Rules
windowrulev2 = float,  class:(pavucontrol)
windowrulev2 = opacity 0.90 0.90, class:(kitty)
windowrulev2 = noanim, class:(wofi)

xwayland { force_zero_scaling = true }
cursor { no_hardware_cursors = true }